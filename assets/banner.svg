<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f8fafc;
    }
    
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    .pulse {
      animation: pulseCircle 6s ease-in-out infinite;
      transform-origin: center;
    }
    
    .float-1 { animation: floatParticle 4s ease-in-out infinite; }
    .float-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Elements (Low Opacity behind Text) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#6366f1" class="pulse" />
    <circle cx="1050" cy="280" r="160" fill="#ec4899" class="pulse" />
  </g>

  <!-- Decorative Flow Line Graphic (Background Layer) -->
  <path d="M 50 300 Q 300 200, 600 260 T 1150 120" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.35" />
  <path d="M 50 320 Q 350 240, 650 290 T 1150 150" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.25" />

  <!-- Dynamic Status Pills (Positioned around borders to leave center clear) -->
  <g class="float-1" opacity="0.85">
    <rect x="80" y="45" width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <circle cx="100" cy="63" r="6" fill="#10b981" />
    <text x="116" y="68" class="badge-text">Lead Automation</text>
  </g>

  <g class="float-2" opacity="0.85">
    <rect x="940" y="45" width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <circle cx="960" cy="63" r="6" fill="#6366f1" />
    <text x="976" y="68" class="badge-text">Open-Source CRM</text>
  </g>

  <g class="float-1" opacity="0.85">
    <rect x="960" y="275" width="160" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <circle cx="980" cy="293" r="6" fill="#ec4899" />
    <text x="996" y="298" class="badge-text">SaaS Ecosystem</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Accent Line above Title -->
    <rect x="540" y="105" width="120" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Main Title -->
    <text x="600" y="175" class="title" filter="url(#glow)">Awesome All-In-One SMB CRM</text>
    
    <!-- Subtitle -->
    <text x="600" y="220" class="subtitle">Top Commercial SaaS Platforms & Open-Source CRM Frameworks</text>
    
    <!-- Tagline -->
    <text x="600" y="255" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="1">
      CONTACT MANAGEMENT • SALES PIPELINES • MARKETING AUTOMATION • SELF-HOSTED
    </text>
  </g>
</svg>
