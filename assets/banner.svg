<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.5; }
    }

    .float-1 { animation: floatParticle1 4s ease-in-out infinite; }
    .float-2 { animation: floatParticle2 5s ease-in-out infinite 1s; }
    .pulse-glow { animation: pulseGlow 6s ease-in-out infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow Circles (In Background) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" class="pulse-glow" />
  <circle cx="1050" cy="280" r="160" fill="#ec4899" class="pulse-glow" />

  <!-- Background Decorative Curved Lines -->
  <path d="M 40 300 Q 300 190, 600 250 T 1160 110" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" />
  <path d="M 40 320 Q 350 230, 650 280 T 1160 140" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.3" />

  <!-- Corner Feature Pills -->
  <g class="float-1">
    <rect x="70" y="45" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="92" cy="64" r="6" fill="#10b981" />
    <text x="108" y="69" class="badge-text">Lead Automation</text>
  </g>

  <g class="float-2">
    <rect x="950" y="45" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="972" cy="64" r="6" fill="#6366f1" />
    <text x="988" y="69" class="badge-text">Open-Source CRM</text>
  </g>

  <g class="float-1">
    <rect x="960" y="275" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="982" cy="294" r="6" fill="#ec4899" />
    <text x="998" y="299" class="badge-text">SaaS Ecosystem</text>
  </g>

  <g class="float-2">
    <rect x="70" y="275" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="92" cy="294" r="6" fill="#3b82f6" />
    <text x="108" y="299" class="badge-text">Sales Pipelines</text>
  </g>

  <!-- Center Content Group -->
  <g text-anchor="middle">
    <!-- Accent Line above Title -->
    <rect x="540" y="95" width="120" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Main Title -->
    <text x="600" y="165" class="title">Awesome All-In-One SMB CRM</text>
    
    <!-- Subtitle -->
    <text x="600" y="212" class="subtitle">Top Commercial SaaS Platforms &amp; Open-Source CRM Frameworks</text>
    
    <!-- Tagline -->
    <text x="600" y="252" class="tagline">CONTACT MANAGEMENT • SALES PIPELINES • MARKETING AUTOMATION • SELF-HOSTED</text>
  </g>
</svg>
